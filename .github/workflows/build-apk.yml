name: Build EzTransfer Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Generate and configure Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../EzTransfer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EzTransfer-APK
          path: EzTransfer.apk
          retention-days: 30

      - name: Publish EzTransfer.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: EzTransfer Android APK (Terbaru)
          body: |
            Unduh **EzTransfer.apk** di bawah lalu pasang langsung di HP Android Anda.
            - 100% Gratis & Offline di jaringan WiFi lokal (dilengkapi server WiFi internal di dalam APK).
            - Hasil file & video tersimpan otomatis ke folder **Download/EzTransfer**.
          files: EzTransfer.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
